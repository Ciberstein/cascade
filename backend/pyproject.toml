[project]
name = "cascade-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4's bcrypt-backend self-test (detect_wrap_bug) hashes a 255-byte
    # probe secret via a direct verify() call; bcrypt 5.0.0 is the first release to
    # raise ValueError on secrets >72 bytes instead of silently truncating, which
    # crashes passlib's self-test before any real password is touched. 4.0.1-4.3.x
    # are verified compatible - keep this range until passlib is upgraded/replaced.
    "bcrypt>=4.0.1,<5.0",
    "websockets>=12.0",
    # Parser HTML para los plugins. selectolax sobre bs4: es C puro, no arrastra
    # soup-sieve/lxml, y el parseo ocurre dentro del loop de crawl.
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Los tests live salen a internet: quedan fuera de la corrida normal para que
# la suite no dependa de que un hoster de terceros esté arriba.
addopts = "-m 'not live'"
markers = [
    "live: golpea el sitio real del hoster; correr a mano con -m live",
]

[tool.setuptools.packages.find]
include = ["app*"]
