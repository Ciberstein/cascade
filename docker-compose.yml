services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cascade}
      POSTGRES_DB: cascade
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cascade:${POSTGRES_PASSWORD:-cascade}@postgres:5432/cascade
      # Only the default for a fresh install - once the settings row exists,
      # the download folder saved from the UI wins.
      DOWNLOAD_ROOT: /downloads
    volumes:
      # A Docker-managed volume, not a host folder. The server only parks
      # files here until the browser retrieves them, then deletes them: it is
      # internal state, and putting it in a folder the user can see invites
      # them to delete it and break downloads (which is exactly what
      # happened).
      - staging:/downloads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # This machine only. There is no login any more: leaving it on 0.0.0.0
      # would hand anyone on the network the ability to queue downloads and
      # change the engine limits. Opening it up has to be deliberate:
      # BIND_ADDRESS=0.0.0.0 in .env.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pg_data:
  staging:
