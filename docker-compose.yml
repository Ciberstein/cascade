services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cascade}
      POSTGRES_DB: cascade
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cascade:${POSTGRES_PASSWORD:-cascade}@postgres:5432/cascade
      # Only the default for a fresh install - once the settings row exists,
      # the download folder saved from the UI wins.
      DOWNLOAD_ROOT: /downloads
    volumes:
      # Volumen gestionado por Docker, no una carpeta del host. Acá el servidor
      # solo estaciona archivos hasta que el usuario los retira por el
      # navegador, y después los borra: es estado interno, y ponerlo en una
      # carpeta que el usuario ve invita a que lo borre y rompa las descargas
      # (que es exactamente lo que pasó).
      - staging:/downloads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # Solo desde esta máquina. Ya no hay login: dejarlo en 0.0.0.0 pondría
      # a disposición de cualquiera en la red la capacidad de encolar descargas
      # y de cambiar los límites del motor. Para abrirlo a la red hay que
      # decidirlo a propósito: BIND_ADDRESS=0.0.0.0 en el .env.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pg_data:
  staging:
