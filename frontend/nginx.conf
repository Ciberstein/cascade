# Serves the SPA and reverse-proxies the API on the same origin, so the
# httpOnly auth cookie and the WebSocket both work with no CORS setup.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location ~ ^/(auth|packages|settings|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        # Downloads run for hours and the client never sends anything after the
        # handshake; the default 60s read timeout would drop an idle-but-live
        # progress socket and force a reconnect every minute.
        proxy_read_timeout 1h;
    }
}
