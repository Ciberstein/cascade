# Sirve la SPA y hace de proxy hacia la API en el mismo origen, así el
# WebSocket funciona sin configurar CORS.
server {
    listen 80;

    # Lo estático se enumera; TODO lo demás va al backend.
    #
    # Está al revés a propósito. Antes se enumeraban las rutas de la API, y
    # cada router nuevo obligaba a acordarse de agregarlo acá: si se olvidaba,
    # nginx servía la SPA en esa ruta y la llamada moría con un 404 o 405 con
    # toda la suite en verde - los tests del frontend mockean fetch y los del
    # backend hablan con la app en proceso, así que nadie ejercita este ruteo.
    # Pasó con /crawl-jobs y volvió a pasar con /account. Cascade no usa
    # rutas del lado del cliente (las vistas son estado), así que la lista de
    # lo estático es corta y estable, y la de la API deja de existir.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?|txt)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Downloads run for hours and the client never sends anything after the
        # handshake; the default 60s read timeout would drop an idle-but-live
        # progress socket and force a reconnect every minute.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Cascade-Owner $http_x_cascade_owner;
    }
}
