<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tres rieles bajando en escalón: el mismo medidor que mide cada descarga
       dentro de la app, a escala de marca. -->
  <defs>
    <linearGradient id="caudal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9dab"/>
      <stop offset="1" stop-color="#0d6a78"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="6" height="15" rx="3" fill="url(#caudal)"/>
  <rect x="13" y="9" width="6" height="16" rx="3" fill="url(#caudal)"/>
  <rect x="22" y="15" width="6" height="13" rx="3" fill="url(#caudal)"/>
</svg>
